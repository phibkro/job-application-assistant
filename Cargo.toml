[workspace]
members = [
  "crates/job-index-core",
  "crates/job-index-worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
job-index-core = { path = "crates/job-index-core" }
js-sys = "=0.3.102"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
hmac = "=0.13.0"
futures-util = "=0.3.33"
worker = { version = "=0.8.5", features = ["d1"] }
# Same crate instance the `worker` re-export of `Url` comes from, so the typed
# `Host` variants are usable when validating webhook targets.
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
