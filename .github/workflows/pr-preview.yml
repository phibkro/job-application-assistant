name: pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pr-preview
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install pinned devenv CLI
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - run: devenv shell -- bun install --frozen-lockfile
      - run: devenv shell -- vp run setup
      - run: devenv shell -- vp run verify
      # WS-0029@2 pass B: a Worker Preview of job-index-pr-previews, bound to
      # the shared seeded preview D1. The script ends with the Access smoke:
      # an unauthenticated request must be refused, the service token must
      # reach /api/health and seeded /api/v1/jobs.
      - name: Deploy Worker Preview behind Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CI: "1"
        run: devenv shell -- ./scripts/deploy-preview.sh "${{ github.event.pull_request.number }}"

  destroy:
    if: >-
      always() &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pr-preview
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install pinned devenv CLI
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - run: devenv shell -- bun install --frozen-lockfile
      - run: devenv shell -- vp run setup
      - name: Delete Worker Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CI: "1"
        run: devenv shell -- ./scripts/destroy-preview.sh "${{ github.event.pull_request.number }}"
