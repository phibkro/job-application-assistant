name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      # The same pinned devenv CLI as phibkro/vektorprogrammet-reimagined's checks.yml.
      - name: Install pinned devenv CLI
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Install workspace dependencies
        run: devenv shell -- bun install --frozen-lockfile
      - name: Vite+ static checks
        run: devenv shell -- vp check
      # Setup, policy gates, vp check, imports/types/Effect diagnostics, schema/catalog/bundle, coverage-gated tests.
      # This is the only test execution (WS-0030 P2): the `coverage` sub-task runs both Vitest 4 suites (Bun-hosted
      # unit, then workerd pool) with --coverage thresholds. A failure is attributable from the `vp run` task name in
      # the log: `coverage` is the tests, `policy`/`typecheck`/`effect:check`/... are the static gates before it.
      - name: Verify
        run: devenv shell -- vp run verify
